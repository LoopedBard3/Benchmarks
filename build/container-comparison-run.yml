parameters:
- name: connection
  type: string
- name: serviceBusQueueName
  type: string
- name: serviceBusNamespace
  type: string
- name: configUrl
  type: string
- name: profileUrl
  type: string
- name: hostArguments
  type: string
- name: scenario
  type: object
- name: size
  type: object
- name: rate
  type: object

steps:
- task: PublishToAzureServiceBus@2
  condition: succeededOrFailed()
  displayName: ${{ parameters.scenario.displayName }} - ${{ parameters.size.displayName }} - ${{ parameters.rate.displayName }}
  timeoutInMinutes: 30
  inputs:
    connectedServiceName: ${{ parameters.connection }}
    serviceBusQueueName: ${{ parameters.serviceBusQueueName }}
    serviceBusNamespace: ${{ parameters.serviceBusNamespace }}
    waitForCompletion: true
    useDataContractSerializer: "false"
    messageBody: |
      {
        "name": "crank",
        "condition": "true",
        "retries": 1,
        "args": [ "--session $(session) --config ${{ parameters.configUrl }} --config ${{ parameters.profileUrl }} ${{ parameters.hostArguments }} ${{ parameters.scenario.arguments }} ${{ parameters.size.arguments }} ${{ parameters.rate.arguments }} --no-metadata --no-measurements --load.options.reuseBuild true --description \"${{ parameters.scenario.displayName }} - ${{ parameters.size.displayName }} - ${{ parameters.rate.displayName }} - $(System.JobDisplayName)\" --property buildId=\"$(buildId)\" --property buildNumber=\"$(buildNumber)\" --command-line-property --table ContainerComparisonBenchmarks --sql SQL_CONNECTION_STRING --cert-tenant-id SQL_SERVER_TENANTID --cert-client-id SQL_SERVER_CLIENTID --cert-path SQL_SERVER_CERT_PATH --cert-sni --chart" ]
      }
