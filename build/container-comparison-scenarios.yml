parameters:
- name: runMode
  type: string
  default: preflight
  values:
  - preflight
  - full
- name: connection
  type: string
- name: serviceBusQueueName
  type: string
- name: serviceBusNamespace
  type: string
- name: configUrl
  type: string
- name: profileUrl
  type: string
- name: hostArguments
  type: string
- name: preflightSize
  type: object
  default:
    displayName: 1 CPU quota / 512 MB
    arguments: --property cpu=1 --property mem=512mb --property size=1000m-512mb --application.cpuLimitRatio 1 --application.memoryLimitInBytes 512000000
- name: preflightRate
  type: object
  default:
    displayName: 1000 RPS
    arguments: --variable rate=1000 --property rate=1000 --load.job bombardier
- name: sizes
  type: object
  default:
  - displayName: 0.1 CPU quota / 256 MB
    arguments: --property cpu=0.1 --property mem=256mb --property size=100m-256mb --application.cpuLimitRatio 0.1 --application.memoryLimitInBytes 256000000
  - displayName: 0.25 CPU quota / 256 MB
    arguments: --property cpu=0.25 --property mem=256mb --property size=250m-256mb --application.cpuLimitRatio 0.25 --application.memoryLimitInBytes 256000000
  - displayName: 0.5 CPU quota / 256 MB
    arguments: --property cpu=0.5 --property mem=256mb --property size=500m-256mb --application.cpuLimitRatio 0.5 --application.memoryLimitInBytes 256000000
  - displayName: 1 CPU quota / 512 MB
    arguments: --property cpu=1 --property mem=512mb --property size=1000m-512mb --application.cpuLimitRatio 1 --application.memoryLimitInBytes 512000000
  - displayName: 4 CPU quota / 1 GB
    arguments: --property cpu=4 --property mem=1gb --property size=4000m-1gb --application.cpuLimitRatio 4 --application.memoryLimitInBytes 1000000000
  - displayName: Unlimited
    arguments: --property cpu=unlimited --property mem=unlimited --property size=unlimited
  - displayName: Pinned 1 core / 512 MB
    arguments: --property cpu=1 --property mem=512mb --property size=1core-512mb --application.cpuSet 0 --application.memoryLimitInBytes 512000000
  - displayName: Pinned 4 cores / 1 GB
    arguments: --property cpu=4 --property mem=1gb --property size=4cores-1gb --application.cpuSet 0-3 --application.memoryLimitInBytes 1000000000
- name: rates
  type: object
  default:
  - displayName: 1000 RPS
    arguments: --variable rate=1000 --property rate=1000 --load.job bombardier
  - displayName: 10000 RPS
    arguments: --variable rate=10000 --property rate=10000 --load.job bombardier
  - displayName: Unbound
    arguments: --property rate=0
- name: scenarios
  type: object
  default:
  - displayName: ASP.NET JSON
    arguments: --scenario json_aspnet --property scenario=JsonAspNetNet11 --application.source.repository $(benchmarksRepository) --application.source.branchOrCommit $(benchmarksRef)
  - displayName: ASP.NET Fortunes
    arguments: --scenario fortunes_aspnet --property scenario=FortunesAspNetNet11 --application.source.repository $(benchmarksRepository) --application.source.branchOrCommit $(benchmarksRef) --application.environmentVariables DOTNET_gcServer=1 --application.environmentVariables DOTNET_GCDynamicAdaptationMode=0
  - displayName: FastHTTP JSON
    arguments: --scenario json_fasthttp --property scenario=JsonFastHttp
  - displayName: FastHTTP Fortunes
    arguments: --scenario fortunes_fasthttp --property scenario=FortunesFastHttp
  - displayName: xitca-web JSON
    arguments: --scenario json_xitca --property scenario=JsonXitcaWeb
  - displayName: xitca-web Fortunes
    arguments: --scenario fortunes_xitca --property scenario=FortunesXitcaWeb

steps:
- ${{ each scenario in parameters.scenarios }}:
  - ${{ if eq(parameters.runMode, 'preflight') }}:
    - template: container-comparison-run.yml
      parameters:
        connection: ${{ parameters.connection }}
        serviceBusQueueName: ${{ parameters.serviceBusQueueName }}
        serviceBusNamespace: ${{ parameters.serviceBusNamespace }}
        configUrl: ${{ parameters.configUrl }}
        profileUrl: ${{ parameters.profileUrl }}
        hostArguments: ${{ parameters.hostArguments }}
        scenario: ${{ scenario }}
        size: ${{ parameters.preflightSize }}
        rate: ${{ parameters.preflightRate }}
  - ${{ if eq(parameters.runMode, 'full') }}:
    - ${{ each size in parameters.sizes }}:
      - ${{ each rate in parameters.rates }}:
        - template: container-comparison-run.yml
          parameters:
            connection: ${{ parameters.connection }}
            serviceBusQueueName: ${{ parameters.serviceBusQueueName }}
            serviceBusNamespace: ${{ parameters.serviceBusNamespace }}
            configUrl: ${{ parameters.configUrl }}
            profileUrl: ${{ parameters.profileUrl }}
            hostArguments: ${{ parameters.hostArguments }}
            scenario: ${{ scenario }}
            size: ${{ size }}
            rate: ${{ rate }}
